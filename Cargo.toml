[workspace]
resolver = "3"
members = ["lis2mdl-registers", "lis2mdl", "lis2mdl-sim"]
exclude = ["sim/wokwi-chip", "examples"]

[workspace.package]
version = "0.1.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "EUPL-1.2 OR MIT OR Apache-2.0"
repository = "https://github.com/sunsided/lis2mdl"
edition = "2024"
rust-version = "1.85"

[workspace.lints.clippy]
# Modules live in `folder.rs` plus `folder/`, never in `folder/mod.rs`.
mod_module_files = "deny"

[workspace.dependencies]
bitfield-struct = "0.13.0"
defmt = "1.0.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-futures = "0.1.2"
# shortcut: git dependency until fake-bus is on crates.io; switch to a version then.
fake-bus = { git = "https://github.com/sunsided/fake-bus", rev = "6bb6d1f" }
hardware-registers = "0.3.0"
lis2mdl-registers = { path = "lis2mdl-registers", version = "0.1.0" }
lis2mdl-sim = { path = "lis2mdl-sim" }
