[package]
name = "lis2mdl"
description = "A platform-agnostic embedded-hal driver for the STMicroelectronics LIS2MDL magnetometer"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal-driver", "lis2mdl", "magnetometer", "compass", "i2c"]
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
async = ["dep:embedded-hal-async"]
coordinate-frame = ["dep:coordinate-frame"]
defmt = ["dep:defmt", "lis2mdl-registers/defmt", "coordinate-frame?/defmt"]

[lints]
workspace = true

[dependencies]
lis2mdl-registers.workspace = true
coordinate-frame = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async = { workspace = true, optional = true }

[dev-dependencies]
coordinate-frame.workspace = true
embedded-hal.workspace = true
lis2mdl-sim.workspace = true
embassy-futures.workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/lis2mdl/releases/tag/v{{version}}", exactly = 1 },
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
